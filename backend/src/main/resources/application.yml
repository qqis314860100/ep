spring:
  application:
    name: simulation-asset-service
  profiles:
    # 真实数据库是唯一数据源：默认即 local（本机 MySQL）。切换生产部署形态用 SPRING_PROFILES_ACTIVE=oceanbase。
    default: local
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 550MB
      file-size-threshold: 2MB

server:
  port: ${SERVER_PORT:8080}

asset:
  # 结构开关只用于「库结构是否就绪」的快速排查；不再有内存兜底实现，关掉即启动失败（fail fast）。
  extension-schema-enabled: ${ASSET_EXTENSION_SCHEMA_ENABLED:true}
  governance-schema-enabled: ${ASSET_GOVERNANCE_SCHEMA_ENABLED:true}
  governance-scan:
    enabled: ${ASSET_GOVERNANCE_SCAN_ENABLED:false}
    fixed-delay-ms: ${ASSET_GOVERNANCE_SCAN_FIXED_DELAY_MS:86400000}
  libreoffice-binary: ${ASSET_LIBREOFFICE_BINARY:soffice}
  package-max-size-bytes: ${ASSET_PACKAGE_MAX_SIZE_BYTES:524288000}

# AI 能力服务（泛化 rag 服务）连接：base-url 指向其根地址，api-key 为空时请求不带 X-Service-Key。
ai:
  capability:
    # 运行时唯一真实能力服务（Http 客户端指向 rag）
    base-url: ${AI_CAPABILITY_BASE_URL:http://localhost:8000}
    api-key: ${AI_CAPABILITY_API_KEY:}
    namespace: ${AI_CAPABILITY_NAMESPACE:ep-docs}
    connect-timeout-millis: ${AI_CAPABILITY_CONNECT_TIMEOUT_MILLIS:2000}
    request-timeout-millis: ${AI_CAPABILITY_REQUEST_TIMEOUT_MILLIS:60000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

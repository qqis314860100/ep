spring:
  application:
    name: simulation-asset-service
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 550MB
      file-size-threshold: 2MB

server:
  port: ${SERVER_PORT:8080}

asset:
  extension-schema-enabled: ${ASSET_EXTENSION_SCHEMA_ENABLED:false}
  governance-schema-enabled: ${ASSET_GOVERNANCE_SCHEMA_ENABLED:false}
  governance-scan:
    enabled: ${ASSET_GOVERNANCE_SCAN_ENABLED:false}
    fixed-delay-ms: ${ASSET_GOVERNANCE_SCAN_FIXED_DELAY_MS:86400000}
  libreoffice-binary: ${ASSET_LIBREOFFICE_BINARY:soffice}
  package-max-size-bytes: ${ASSET_PACKAGE_MAX_SIZE_BYTES:524288000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:2881}/${DB_NAME:tianshu}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 5000

asset:
  extension-schema-enabled: ${ASSET_EXTENSION_SCHEMA_ENABLED:true}
  governance-schema-enabled: ${ASSET_GOVERNANCE_SCHEMA_ENABLED:true}
